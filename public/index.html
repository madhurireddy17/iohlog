<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>iohlog</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <style>
    /* Gumroad Button Style */
    .button {
      --bg: #6B4226;
      --hover-bg: #D7B49E;
      --hover-text: #000;
      color: #fff;
      cursor: pointer;
      border: 1px solid var(--bg);
      border-radius: 8px;
      padding: 0.8em 2em;
      background: var(--bg);
      transition: 0.3s;
      font-size: 1rem;
    }
    .button:hover {
      color: var(--hover-text);
      transform: translate(-0.2rem, -0.2rem);
      background: var(--hover-bg);
      box-shadow: 0.2rem 0.2rem var(--bg);
    }
    .button:active {
      transform: translate(0);
      box-shadow: none;
    }
  </style>
</head>
<body class="bg-[#E3E3E3]">
  <div id="root"></div>
</body>
</html>
